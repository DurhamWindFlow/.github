# Durham WindFlow — publications.
#
# SOURCE OF TRUTH. Editing this file updates the website's Publications page
# and the table on the GitHub org profile README.
#
# Scope: peer-reviewed JOURNAL ARTICLES by group members that bear on wind
# energy or the atmospheric flows wind farms sit in. Each investigator's full
# record — including Hossein's geophysical fluid dynamics work and Nima's
# wider infrastructure research — is linked from their card on the People
# page. To pull one of those in, just add an entry here.
#
# Fields:
#   year      (int, required)   title (required)   authors (required)
#   venue     journal, volume, article number
#   doi       full https://doi.org/... URL
#   repo      https://github.com/DurhamWindFlow/... if code is published
#   theme     key from site.yml -> themes
#   featured  true to surface it on the home page
#   note      short editorial note shown as a small tag
# Order does not matter — the site groups by year, newest first.
# ---------------------------------------------------------------------------

