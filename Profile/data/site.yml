# --- Website copy -----------------------------------------------------------
# Every sentence the website says in its own voice. It lives here so that all
# editable prose is in this one file, rather than half of it being buried in
# page templates in the website repository.
#
# `lede` is the line under each page's title. `intro` blocks may contain HTML
# links. Headings and blurbs belong to a section of a page.
copy:
  home:
    eyebrow: Durham University
    headline: The fluid mechanics of wind energy, from the blade to the atmospheric boundary layer.
    # Figures live in Profile/Figures/. `alt` is required — describe what the
    # image shows. `caption` appears beneath it; `credit` is the attribution.
    #
    # The home page carries two figures and they sit at deliberately different
    # scales: the hero is the wake of ONE rotor, measured in the tunnel, and
    # the figure above the research themes is a WHOLE FARM in the boundary
    # layer. Between them they frame the range the group works across, which
    # is what the headline claims. Do not set both to the same measurement.
    hero_image: wake-velocity-field.gif
    hero_alt: >
      Animated wind tunnel measurements behind a model turbine, cycling between
      the wind speed field, where the wake appears as a dark low-speed band
      spreading downstream, and the vorticity field, where rows of tip and root
      vortices show as discrete red and blue cores.
    hero_caption: >
      The wake of a model turbine, measured in the wind tunnel, in wind speed
      and then vorticity. The wake is unsteady, and that unsteadiness is what
      sets how quickly it recovers.
    figure_image: wind_farm.png
    figure_alt: >
      Schematic of a wind farm in the atmospheric boundary layer: inflow wind
      speed and potential temperature profiles at the left, flow blockage
      upstream of the turbine row, a farm wake spreading downstream and fed by
      turbulent entrainment from above, and a capping inversion beneath the
      free atmosphere carrying interfacial and internal waves.
    figure_caption: >
      A wind farm is large enough to change the atmosphere it sits in. Our work
      runs from the wake of a single rotor up to this farm-scale picture —
      blockage ahead of the farm, entrainment from above, and the waves the
      farm sets off on the inversion overhead.

    themes_heading: Research themes
    themes_blurb: >
      What we work on.
    code_heading: Open code
    code_blurb: We publish the code and data behind our papers wherever we can.
    code_fallback_heading: Everything else
    code_fallback_text: All of the group's public repositories live in one GitHub organisation.
    hiring_heading: We're hiring
   
  research:
    title: Research
    lede: >
      One problem — understanding and improving how wind farms take energy out
      of the atmosphere.
    description: >
      Research themes at Durham WindFlow — wind farm aerodynamics, wake steering and
      flow control, floating offshore wind, and energy systems and risk.
    intro: >
      Our work runs from the aerodynamics of a single rotor through to the
      systems that get wind capacity built and delivered. What holds it
      together is a preference for models that are simple enough to reason
      about and fast enough to use — grounded in the physics, but built for the
      problems industry actually faces. Much of it is done jointly with groups
      elsewhere, and some of the models we have had a hand in are carried in
      community tools such as <a href="https://github.com/NREL/floris">FLORIS</a>
      and <a href="https://github.com/DTUWindEnergy/PyWake">PyWake</a>, built
      and maintained by the teams at NREL and DTU.
    code_heading: Code & data
    code_text: >
      We publish the code behind our papers where we can. Repositories live in
      the <a href="https://github.com/DurhamWindFlow">Durham WindFlow GitHub
      organisation</a>.

  people:
    title: People
    lede: >
      A multidisciplinary group, from rotor aerodynamics to geophysical fluid
      dynamics to AI for energy infrastructure.
    description: >
      The people of Durham WindFlow — investigators, postdoctoral researchers and
      PhD students at Durham University working on wind energy and atmospheric
      flow.
    joining_heading: Joining us
    joining_text: >
      We welcome enquiries from prospective PhD students, postdoctoral
      researchers and collaborators. Write to whichever of us works closest to
      what interests you — the addresses are on the cards above.

  publications:
    title: Publications
    lede: >
      Peer-reviewed journal articles by group members on wind energy and the
      atmospheric flows wind farms sit in.
    description: >
      Publications from Durham WindFlow at Durham University — wind farm
      aerodynamics, wake steering, floating offshore wind and energy systems.
    # Shown as a callout at the top of the page, not as grey small print. This
    # is where the group's position on credit lives; the home page carries only
    # the one-line version at the end of the site-wide `intro` above, which is
    # deliberate — a whole section on it up front was too much.
    credit_heading: A note on credit
    credit_text: >
      Almost none of this was done alone. Every paper here is shared with
      colleagues at universities, research institutes and companies around the
      world, and we have learned an enormous amount from them. Full credit for
      each paper belongs to all of its authors — please see each publication
      record for the complete author list and affiliations.
    credit_bold_note: >
      Group members' names are shown in bold, purely so you can see who here
      was involved.

  contact:
    title: Enquiries & join us
    lede: We welcome collaboration, and enquiries from prospective students and researchers.
    description: >
      Enquiries, collaboration and current openings for postdoctoral
      researchers and PhD students at Durham WindFlow, Durham University.
    find_us_heading: Where to find us
    who_heading: Who to write to
    who_text: >
      We do not run a central inbox. Write to whichever of us works closest to
      what interests you — nobody will mind an email that turns out to be
      better answered by a colleague, and we will pass it on.
    openings_heading: Openings
    openings_blurb: Current advertised positions in the group.
    openings_none: No advertised positions at the moment.
    phd_heading: Prospective PhD students
    phd_text: >
      We are always glad to hear from strong candidates interested in wind
      energy, atmospheric turbulence and environmental fluid mechanics —
      including those bringing a background in applied mathematics, machine
      learning or data science rather than classical fluid dynamics. Send a CV
      and a short note on what interests you to whichever investigator's work
      is closest to your own; their addresses are just above.

