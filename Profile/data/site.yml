# ---------------------------------------------------------------------------
# Durham WindFlow — global site settings and controlled vocabularies.
#
# This file is the single source of truth for the group's name, blurbs, and
# the labels/ordering used across the website and the GitHub org profile.
# Edit here; both renderers pick it up.
# ---------------------------------------------------------------------------

name: Durham WindFlow
full_name: "Durham WindFlow: Atmospheric Flow and Wind Energy Dynamics Group"
institution: Durham University
url: https://durhamwindflow.github.io
github_org: https://github.com/DurhamWindFlow

tagline: Atmospheric flow and wind energy dynamics at Durham University

# --- Site header banner -----------------------------------------------------
# The photo band across the top of every page on the website. The file lives in
# Profile/Figures/ alongside the research figures. Clear `image` and the band
# disappears — every page still renders, just without it.
#
# Use a wide, shallow photo: it is cropped to a band roughly 3.5:1 and anchored
# so the skyline stays in frame as the viewport narrows.
banner:
  image: durham-cathedral.jpg
  alt: >
    Durham Castle and Cathedral on the wooded peninsula above the River Wear,
    with Framwellgate Bridge crossing the river below.

# One paragraph. Used on the site home page and the org profile README.
intro: >
  Durham WindFlow is a multidisciplinary group at Durham University working on the
  fluid mechanics of wind energy — from the aerodynamics of a single rotor to
  the interaction of whole wind farms with the atmospheric boundary layer, and
  on to the systems that get that energy built and delivered. We bring together
  expertise in wind-farm aerodynamics, laboratory experiment, geophysical fluid
  dynamics and applied mathematics, and artificial intelligence. Nearly all of
  this is done jointly with colleagues elsewhere, and we learn a great deal
  from them.

# No group-wide contact address, by design: the group is collaborative, and a
# single mailto reads as though one person fronts it. Enquiries go to whichever
# member's work is closest to the enquiry — their emails live on their entry in
# people.yml and are rendered on the People page.
contact:
  address_lines:
    - Durham University
    - Durham DH1 3LE
    - United Kingdom

