# ---------------------------------------------------------------------------
# Durham WindFlow — research themes.
#
# SOURCE OF TRUTH for the website's Research page and the theme cards on the
# home page. Each theme's `key` should match a key in site.yml -> themes so
# publications tagged with it are listed automatically underneath.
#
# free text. Everything except `key`, `title` and `summary` is optional.
# ---------------------------------------------------------------------------

# `feature: true` gives a theme the full width of the home page card grid.
# This is the group's core theme and it absorbed three previous entries, so it
# should not sit as one card among equals.
#
# The image is deliberately NOT wind_farm.png: that one is the home page's own
# banner figure, and repeating it here would say the same thing twice.
- key: farm-aero
  title: Wind farm aerodynamics
  summary: >
    The group's core theme: understanding and predicting how wind turbines and
    wind farms perform, and how they interact with the atmosphere around them.
    That means wakes and blockage at both scales — within a farm, and between
    neighbouring farms — along with the two-way coupling between a farm and the
    boundary layer it sits in. We work on all of it with whichever tool the
    question calls for: reduced-order models fast enough to run inside an
    optimisation loop, high-fidelity simulation, and laboratory experiment in
    the wind tunnel. Nearly all of it is joint work with groups elsewhere, and
    some of the models we have had a hand in are carried in community tools
    such as FLORIS and PyWake, built and maintained by the teams at NREL and
    DTU.
  feature: true
  image: farm-scales.jpg
  image_alt: >
    Three ways of modelling a wind farm: finite, using single wakes and superposition; infinite, as added surface roughness with top-down energy transport; and semi-infinite, with infinite width and finite length.
  image_credit: Bastankhah et al., J. Fluid Mech. 985, A43 (2024), CC BY 4.0

- key: control
  title: Wake steering & flow control
  summary: >
    Steering wakes away from downstream turbines, and controlling the flow at
    the blade itself. Work spans analytical models of curled and skewed wakes
    behind yawed rotors, validation against operational wind farm campaigns,
    and smart rotors with actively actuated trailing-edge surfaces.
  image: wake-steering.jpg
  image_alt: >
    Wake steering: yawing upstream turbines deflects their wakes away from those behind, trading a small loss at one turbine for a larger gain across the farm.

- key: floating
  title: Floating offshore wind
  summary: >
    Floating platforms move in all six degrees of freedom, and the wake moves
    with them. We study how platform motion changes wake behaviour and what
    that means for wake steering, loads and economics in floating farms.
  partners: EDF R&D
  # A video rather than a still — figure.html switches on the file extension.
  image: floating-platform.mp4
  image_alt: >
    Simulation of the wake behind a floating wind turbine, in three panels. A horizontal cut and a vertical cut through the wake each show it as a blue low-speed band spreading downstream of the rotor and shifting as the platform moves; beneath them, time histories of the platform's surge, sway and heave. The running surge, sway, heave, roll and pitch values are printed across the top.
  image_caption: >
    A floating platform moves in all six degrees of freedom and the wake moves
    with it. The two cuts through the wake are shown against the platform
    motion driving them.

- key: systems
  title: Energy systems, risk & deployment
  summary: >
    Getting wind capacity built and delivered. This spans optimal energy and
    reserve scheduling that accounts for wake interactions, and AI-based risk
    identification and assessment for wind farm projects — the modelling that
    sits between a good rotor and a working grid asset.
  image: flowers-aep.jpg
  image_alt: >
    Wind roses, turbine layouts and per-turbine energy yield errors for three sites, comparing Gaussian FLOWERS against conventional annual energy production estimates.
  image_credit: Whittaker et al., J. Renew. Sustain. Energy 17, 013306 (2025), CC BY 4.0
